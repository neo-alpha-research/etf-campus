name: Backfill D1 ETF Prices

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of past trading days to fetch"
        required: false
        default: "85"
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Cloudflare account token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \\
            -H "Authorization: Bearer $CLOUDFLARE_D1_TOKEN" \\
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          if [ "$http_code" != "200" ] || ! grep -q '"success":true' "$response_file"; then
            echo "::error::Cloudflare Account API Token verification failed (HTTP $http_code)."
            exit 1
          fi
          echo "Cloudflare Account API Token verified."

      - name: Validate direct D1 configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = "d71905c19e313be635507cee431306d" || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID does not match the Neo Alpha Research account."
            exit 1
          }
          test "$CLOUDFLARE_D1_ID" = "11c4e874-fba2-4e34-91d0-808892284c86" || {
            echo "::error::CLOUDFLARE_D1_ID does not match the etf-prices database."
            exit 1
          }
          case "$CLOUDFLARE_D1_TOKEN" in
            cfat_*) echo "Account API Token format validated." ;;
            *)
              echo "::error::CLOUDFLARE_D1_TOKEN is not an Account API Token."
              exit 1
              ;;
          esac

      - name: Execute Backfill
        env:
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          python scripts/backfill_api.py --days ${{ inputs.days }}
