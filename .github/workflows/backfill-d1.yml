name: Backfill ETF Price History

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of past trading days to fetch"
        required: false
        default: "85"
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Execute signed price backfill
        env:
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          PRICE_INGEST_HMAC_SECRET: ${{ secrets.PRICE_INGEST_HMAC_SECRET }}
        run: python scripts/backfill_api.py --days ${{ inputs.days }}
