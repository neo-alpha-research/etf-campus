name: Backfill D1 ETF Prices

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days to fetch (approx 3 years of trading days)'
        required: false
        default: '750'
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Generate SQL Backfill File
        env:
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
        run: |
          python scripts/backfill_d1_prices.py --days ${{ inputs.days }} --out backfill.sql

      - name: Execute SQL in Cloudflare D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          wrangler d1 execute etf-prices --remote --file=backfill.sql
