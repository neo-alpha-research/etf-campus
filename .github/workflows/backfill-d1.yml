name: Backfill ETF Price History

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Recent closed trading days to upsert"
        required: false
        default: "3"
        type: string
      start_date:
        description: "Optional inclusive backfill start date (YYYYMMDD; set together with end_date)"
        required: false
        default: ""
        type: string
      end_date:
        description: "Optional inclusive backfill end date (YYYYMMDD; set together with start_date)"
        required: false
        default: ""
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 xlrd

      - name: Check signed ingestion configuration
        shell: bash
        env:
          PRICE_INGEST_HMAC_SECRET: ${{ secrets.PRICE_INGEST_HMAC_SECRET }}
        run: |
          if [ -z "$PRICE_INGEST_HMAC_SECRET" ]; then
            echo "::error::PRICE_INGEST_HMAC_SECRET is missing. Add the same secret to GitHub Actions and Cloudflare Pages production settings."
            exit 1
          fi
      - name: Execute signed price backfill
        env:
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          PRICE_INGEST_HMAC_SECRET: ${{ secrets.PRICE_INGEST_HMAC_SECRET }}
        run: |
          if [ -n "${{ inputs.start_date }}" ] || [ -n "${{ inputs.end_date }}" ]; then
            if [ -z "${{ inputs.start_date }}" ] || [ -z "${{ inputs.end_date }}" ]; then
              echo "::error::start_date and end_date must be provided together in YYYYMMDD format."
              exit 1
            fi
            python scripts/backfill_api.py --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}"
          else
            python scripts/backfill_api.py --days "${{ inputs.days }}"
          fi
