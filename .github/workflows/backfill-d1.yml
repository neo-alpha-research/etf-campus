name: Backfill D1 ETF Prices

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days to fetch (Max 85 days per day for Free Tier)'
        required: false
        default: '85'
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Execute SQL in Cloudflare D1
        env:
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/backfill_api.py --days ${{ inputs.days }}
          npx wrangler d1 execute etf-prices --remote --file=backfill.sql
