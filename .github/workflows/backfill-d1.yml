name: Backfill D1 ETF Prices

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days to fetch (approx 3 years of trading days)'
        required: false
        default: '750'
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Execute API Backfill
        env:
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          python scripts/backfill_api.py --days ${{ inputs.days }}
