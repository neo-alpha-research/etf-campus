name: Backfill Historical ETF Snapshots

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Space-separated dates in YYYYMMDD (leave blank for all 20 historical anchor dates)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: backfill-historical-snapshots
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install requests urllib3

      - name: Run Historical Snapshot Backfill
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dd71905c19e313be635507cee431306d
        run: |
          if [ -n "${{ inputs.dates }}" ]; then
            python scripts/backfill_briefing_historical_dates.py --dates ${{ inputs.dates }}
          else
            python scripts/backfill_briefing_historical_dates.py
          fi

      - name: Recompute STEP 7 Dynamic Multi-Timeframe Series
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dd71905c19e313be635507cee431306d
        run: |
          node scripts/update_truthful_monthly_timeseries.js
          node scripts/recompute_step6_market_scale.js
          python scripts/verify_zero_hallucination.py

      - name: Trigger Briefing Publisher & Cache Purge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run market-briefing-production.yml --ref ${{ github.ref_name }}
          echo "Dispatched production briefing build and edge cache purge."
