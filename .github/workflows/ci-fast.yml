name: Fast Validation

on: 
  push:
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.ci.json
      - run: npm test
      - name: Typecheck active Cloudflare Workers
        run: |
          npm --workspace=workers/market-briefing-publisher run typecheck
          npm --workspace=workers/market-briefing-distributor run typecheck
          npm --workspace=workers/community-maintenance run typecheck