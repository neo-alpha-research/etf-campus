name: Community board auto-activation

on:
  schedule:
    # 매일 03:00 KST (= UTC 18:00) — GitHub Actions 한산 시간대
    # KST = UTC+9 이므로: 03:00 KST = 전날 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "대상 날짜 (YYYY-MM-DD). 비워두면 오늘 KST 기준 자동 적용."
        required: false
        type: string
      dry_run:
        description: "Dry-run 모드 (파일 저장 없이 미리보기)"
        required: false
        type: boolean
        default: false

jobs:
  add-community-posts:
    name: Add 3 community posts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve target date (KST)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "TARGET_DATE=${{ github.event.inputs.date }}" >> $GITHUB_ENV
          else
            # 현재 UTC → KST 변환 (UTC+9)
            TARGET=$(TZ=Asia/Seoul date +%Y-%m-%d)
            echo "TARGET_DATE=$TARGET" >> $GITHUB_ENV
          fi
          echo "Resolved target date: $TARGET_DATE"

      - name: Generate community posts
        run: |
          ARGS="--date ${{ env.TARGET_DATE }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/community/add_posts.py $ARGS
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate tickers (Zero-Hallucination gate)
        run: python scripts/community/validate_tickers.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Skip remaining steps on dry-run
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "Dry-run mode: skipping git commit and push."
          exit 0

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet public/mock-community-posts.json scripts/community/topic_bank.json; then
            echo "CHANGED=false" >> $GITHUB_ENV
          else
            echo "CHANGED=true" >> $GITHUB_ENV
          fi

      - name: Commit and push
        if: env.CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/mock-community-posts.json scripts/community/topic_bank.json
          git commit -m "feat(community): auto-activate board posts for ${{ env.TARGET_DATE }} [skip ci]"
          git pull origin main --rebase
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report result
        if: always()
        run: |
          echo "=== Community Post Activation Report ==="
          echo "Date: ${{ env.TARGET_DATE }}"
          python -c "
          import json
          with open('public/mock-community-posts.json', encoding='utf-8') as f:
              d = json.load(f)
          print(f'Total posts: {len(d[\"posts\"])}')
          recent = [p for p in d['posts'] if p['createdAt'].startswith('${{ env.TARGET_DATE }}')]
          print(f'Posts for today: {len(recent)}')
          for p in recent:
              print(f'  - [{p[\"category\"][\"slug\"]}] {p[\"title\"][:60]}')
          "
