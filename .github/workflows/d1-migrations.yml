name: D1 Migrations and Verification

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date to verify (YYYY-MM-DD, leave blank for latest)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  migrate_and_verify:
    name: Apply Migrations and Verify D1
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 certifi requests xlrd curl_cffi "pydantic>=2.0"

      - name: Apply unapplied D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          npx wrangler d1 migrations apply etf-prices --remote

      - name: Verify migration applied in D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          npx wrangler d1 execute etf-prices --remote --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id DESC LIMIT 5;"

      - name: Re-publish canonical market snapshot to D1
        env:
          PRICE_INGEST_HMAC_SECRET: ${{ secrets.PRICE_INGEST_HMAC_SECRET }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/publish_market_source_snapshot.py

      - name: Query market_source_index_daily in D1 to verify all 12 indices
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          TARGET_DT="${{ inputs.target_date }}"
          if [ -z "$TARGET_DT" ]; then
            npx wrangler d1 execute etf-prices --remote --command "SELECT COUNT(*) AS total_rows, COUNT(DISTINCT index_code) AS unique_indices FROM market_source_index_daily WHERE as_of_date = (SELECT MAX(as_of_date) FROM market_source_index_daily);"
            npx wrangler d1 execute etf-prices --remote --command "SELECT as_of_date, index_code, index_name, close_value, change_pct FROM market_source_index_daily WHERE as_of_date = (SELECT MAX(as_of_date) FROM market_source_index_daily) ORDER BY index_code ASC;"
          else
            npx wrangler d1 execute etf-prices --remote --command "SELECT COUNT(*) AS total_rows, COUNT(DISTINCT index_code) AS unique_indices FROM market_source_index_daily WHERE as_of_date = '$TARGET_DT';"
            npx wrangler d1 execute etf-prices --remote --command "SELECT as_of_date, index_code, index_name, close_value, change_pct FROM market_source_index_daily WHERE as_of_date = '$TARGET_DT' ORDER BY index_code ASC;"
          fi
          npx wrangler d1 execute etf-prices --remote --command "SELECT COUNT(*) AS audit_rows FROM market_source_index_daily_audit;"
          npx wrangler d1 execute etf-prices --remote --command "SELECT as_of_date, COUNT(*) AS count_per_date, COUNT(DISTINCT index_code) AS unique_indices FROM market_source_index_daily GROUP BY as_of_date ORDER BY as_of_date DESC LIMIT 5;"
          npx wrangler d1 execute etf-prices --remote --command "SELECT as_of_date, source_version, COUNT(*) AS audit_count_per_version FROM market_source_index_daily_audit GROUP BY as_of_date, source_version ORDER BY as_of_date DESC, source_version DESC LIMIT 10;"
          npx wrangler d1 execute etf-prices --remote --command "SELECT (SELECT COUNT(*) FROM market_source_index_daily) AS current_total, (SELECT COUNT(*) FROM market_source_index_daily_audit) AS audit_total;"
