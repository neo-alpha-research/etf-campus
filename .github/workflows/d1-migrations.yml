name: D1 Migrations and Verification

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date to re-publish canonical market snapshot (YYYY-MM-DD)"
        required: false
        default: "2026-09-16"

permissions:
  contents: read

jobs:
  migrate_and_verify:
    name: Apply Migrations and Verify D1
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 certifi requests xlrd curl_cffi "pydantic>=2.0"

      - name: Apply unapplied D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          npx wrangler d1 migrations apply etf-prices --remote

      - name: Verify migration applied in D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          npx wrangler d1 execute etf-prices --remote --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id DESC LIMIT 5;"

      - name: Re-publish canonical market snapshot to D1
        env:
          PRICE_INGEST_HMAC_SECRET: ${{ secrets.PRICE_INGEST_HMAC_SECRET }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/publish_market_source_snapshot.py

      - name: Query market_source_index_daily in D1 to verify all 12 indices
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          npx wrangler d1 execute etf-prices --remote --command "SELECT as_of_date, index_code, index_name, close_value, change_pct FROM market_source_index_daily WHERE as_of_date='${{ inputs.target_date }}' ORDER BY index_code ASC;"
