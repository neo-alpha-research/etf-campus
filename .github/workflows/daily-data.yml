name: Daily ETF data refresh

on:
  schedule:
    # 13:30 KST, Monday-Saturday: reconcile the latest available prior close.
    - cron: "30 4 * * 1-6"
    # KRX EOD checks after the close and after the second official close feed.
    - cron: "30 7 * * 1-5"
    - cron: "20 9 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      target:
        description: "Target date in YYYYMMDD (blank uses yesterday)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-etf-data
  # Keep one refresh at a time. A manual retry must not cancel a nearly
  # completed data commit; the job-level timeout still bounds stalled runs.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The collector is bounded to a small set of snapshot requests. Fail fast
    # rather than holding an Actions runner for most of an hour on API delays.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh official ETF data
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          TARGET_DATE: ${{ inputs.target }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/update_daily_data.py --target "$TARGET_DATE" --require-exact-date
          elif [ "$SCHEDULE" = "30 7 * * 1-5" ] || [ "$SCHEDULE" = "20 9 * * 1-5" ] || [ "$SCHEDULE" = "30 11 * * 1-5" ]; then
            TODAY_KST="$(TZ=Asia/Seoul date +%Y%m%d)"
            python scripts/update_daily_data.py --target "$TODAY_KST" --require-exact-date
          else
            python scripts/update_daily_data.py
          fi

      - name: Refresh classification review draft
        run: python scripts/build_classification_review.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate refreshed data
        env:
          NEXT_PUBLIC_SITE_URL: https://etf-campus.pages.dev
        run: |
          python -m unittest discover -s scripts/tests
          npm test
          npm run build

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/etf_master_draft.csv data/etf_returns_draft.csv data/pension_verify_sheet.csv data/classification; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "etf-campus-data-bot"
          git config user.email "etf-campus-data-bot@users.noreply.github.com"
          git add data/etf_master_draft.csv data/etf_returns_draft.csv data/pension_verify_sheet.csv data/classification
          git commit -m "data: refresh ETF snapshot"
          git push
