name: Daily ETF data refresh

on:
  schedule:
    # 09:30 KST, Monday-Saturday. Saturday run picks up Friday's close.
    - cron: "30 0 * * 1-6"
  workflow_dispatch:
    inputs:
      target:
        description: "Target date in YYYYMMDD (blank uses yesterday)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-etf-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh official ETF data
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          TARGET_DATE: ${{ inputs.target }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/update_daily_data.py --target "$TARGET_DATE"
          else
            python scripts/update_daily_data.py
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate refreshed data
        env:
          NEXT_PUBLIC_SITE_URL: https://etf-campus.pages.dev
        run: |
          npm test
          npm run build

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/etf_master_draft.csv data/etf_returns_draft.csv data/pension_verify_sheet.csv; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "etf-campus-data-bot"
          git config user.email "etf-campus-data-bot@users.noreply.github.com"
          git add data/etf_master_draft.csv data/etf_returns_draft.csv data/pension_verify_sheet.csv
          git commit -m "data: refresh ETF snapshot"
          git push
