name: Daily ETF distribution refresh

on:
  schedule:
    - cron: "07 4 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-distribution
  cancel-in-progress: false

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check if already succeeded today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run requested. Bypassing already-succeeded guard."
            echo "already_run=false" >> "$GITHUB_OUTPUT"
          elif python scripts/check_workflow_success_today.py --workflow daily-distribution.yml; then
            echo "already_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.already_run != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        if: steps.guard.outputs.already_run != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 certifi requests xlrd lxml curl_cffi

      - name: Refresh distribution sources and return status
        if: steps.guard.outputs.already_run != 'true'
        id: distribution
        run: python scripts/run_daily_distribution_update.py

      - name: Write distribution collection diagnostics
        if: always() && steps.guard.outputs.already_run != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          seibro_report = Path("data/distributions/reports/seibro_collection_latest.json")
          daily_report = Path("data/distributions/reports/daily_distribution_update_latest.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          lines = ["### ETF Distribution Collection Status (SEIBro Official)\n\n"]
          if seibro_report.exists():
              with seibro_report.open(encoding="utf-8") as f:
                  sdata = json.load(f)
              lines.append(f"- Data Source: **한국예탁결제원 (SEIBro)**\n")
              lines.append(f"- Collection Status: **{sdata.get('status', 'unknown')}**\n")
              lines.append(f"- Fetched Events: **{sdata.get('fetched_events', 0)}**\n")
              lines.append(f"- Total Events in Ledger: **{sdata.get('total_events_in_ledger', 0)}**\n")
              lines.append(f"- Duration: **{sdata.get('duration_seconds', 0):.2f}s**\n\n")

          if daily_report.exists():
              with daily_report.open(encoding="utf-8") as f:
                  ddata = json.load(f)
              lines.append(f"### Pipeline Update Summary\n\n")
              lines.append(f"- Overall Status: **{ddata.get('status', 'unknown')}**\n")
              lines.append(f"- Total Pipeline Steps: **{len(ddata.get('steps', []))}**\n\n")
              lines.append("| Step | Duration | Exit Code |\n|---|---|---|\n")
              for step in ddata.get("steps", []):
                  lines.append(f"| {step.get('name')} | {step.get('duration_seconds', 0):.2f}s | {step.get('exit_code')} |\n")

          with summary_path.open("a", encoding="utf-8") as out:
              out.writelines(lines)
          PY

      - name: Upload distribution collection diagnostics
        if: always() && steps.guard.outputs.already_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distribution-collection-diagnostics-${{ github.run_id }}
          path: |
            data/distributions/reports/seibro_collection_latest.json
            data/distributions/reports/daily_distribution_update_latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Detect distribution changes
        if: steps.guard.outputs.already_run != 'true'
        id: changes
        run: |
          git add data/distributions/
          if ! git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit distribution updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update daily ETF distributions [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }} && break || sleep 5
          done
