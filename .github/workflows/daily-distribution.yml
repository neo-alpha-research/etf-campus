name: Daily ETF distribution refresh

on:
  schedule:
    - cron: "16 21-23 * * 1-5"
    - cron: "16 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-etf-data
  cancel-in-progress: false

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check if already succeeded today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python scripts/check_workflow_success_today.py --workflow daily-distribution.yml; then
            echo "already_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.already_run != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        if: steps.guard.outputs.already_run != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 certifi requests xlrd lxml

      - name: Refresh distribution sources and return status
        if: steps.guard.outputs.already_run != 'true'
        id: distribution
        run: python scripts/run_daily_distribution_update.py

      - name: Write distribution collection diagnostics
        if: always() && steps.guard.outputs.already_run != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("data/distributions/reports/official_source_collection_latest.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          if not report_path.exists():
              summary_path.write_text("No diagnostics found.\n")
              raise SystemExit(0)

          with report_path.open(encoding="utf-8") as f:
              report = json.load(f)

          with summary_path.open("a", encoding="utf-8") as out:
              out.write("### Distribution Collection Status\n\n")
              out.write(f"- Duration: {report.get('duration_seconds', 0):.2f}s\n")
              out.write(f"- Passed: **{report.get('passed', 0)}**\n")
              out.write(f"- Issues: **{len(report.get('issues', []))}**\n\n")

              if report.get("issues"):
                  out.write("#### Issues encountered:\n`\n")
                  for issue in report.get("issues", []):
                      out.write(f"{issue.get('source_id', 'unknown')} | date={issue.get('request_date_utc', 'unknown')} | ")
                      out.write(f"status={issue.get('http_status', 'network')} | attempts={issue.get('attempts', 0)} | ")
                      out.write(f"category={issue.get('failure_category', 'unknown')} | reason={issue.get('final_failure_reason', 'unknown')}\n")
                  out.write("`\n")
          PY

      - name: Upload distribution collection diagnostics
        if: always() && steps.guard.outputs.already_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distribution-collection-diagnostics-${{ github.run_id }}
          path: |
            data/distributions/reports/official_source_collection_latest.json
            data/distributions/reports/daily_distribution_update_latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Detect distribution changes
        if: steps.guard.outputs.already_run != 'true'
        id: changes
        run: |
          git add data/distributions/
          if ! git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit distribution updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update daily ETF distributions [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && break || sleep 5
          done
