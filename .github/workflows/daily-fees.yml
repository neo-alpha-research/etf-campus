name: Update ETF Fees

on:
  schedule:
    - cron: "37 23 * * 1-5"
    - cron: "37 0-3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-etf-data
  cancel-in-progress: false

jobs:
  update-fees:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check if already succeeded today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python scripts/check_workflow_success_today.py --workflow daily-fees.yml; then
            echo "already_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.already_run != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.guard.outputs.already_run != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml requests

      - name: Run fee scraper
        if: steps.guard.outputs.already_run != 'true'
        run: python scripts/refresh_fees.py

      - name: Commit and push changes
        if: steps.guard.outputs.already_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fees/etf_fee_registry.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily ETF fees [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }} && break || sleep 5
            done
          else
            echo "No fee changes detected."
          fi
