name: Update ETF Holdings

on:
  schedule:
    - cron: "0 10 * * 1-5" # 19:00 KST
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-holdings
  cancel-in-progress: false

jobs:
  update-holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check if already succeeded today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python scripts/check_workflow_success_today.py --workflow daily-holdings.yml; then
            echo "already_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.already_run != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        if: steps.guard.outputs.already_run != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.guard.outputs.already_run != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Scrape ETF holdings and generate D1 SQL batches
        if: steps.guard.outputs.already_run != 'true'
        run: |
          python scripts/refresh_holdings.py --no-json --sql-dir=temp_holdings_chunks --chunk-size=100

      - name: Ingest holdings to Cloudflare D1
        if: steps.guard.outputs.already_run != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Applying D1 holdings table schema..."
          npx --yes wrangler@4.124.0 d1 execute etf-prices --remote --file=scripts/d1_holdings_schema.sql
          
          echo "Executing SQL chunk batches to Cloudflare D1..."
          for chunk in temp_holdings_chunks/*.sql; do
            echo "-> Ingesting $(basename "$chunk")..."
            npx --yes wrangler@4.124.0 d1 execute etf-prices --remote --file="$chunk"
          done

          echo "Verifying ingested holdings count..."
          npx --yes wrangler@4.124.0 d1 execute etf-prices --remote --command="SELECT COUNT(*) AS total_holdings, MAX(as_of_date) AS latest_date FROM etf_holdings;"
