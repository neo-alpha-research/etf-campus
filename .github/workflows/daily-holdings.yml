name: Update ETF Holdings

on:
  schedule:
    - cron: "0 10 * * 1-5" # 19:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-holdings
  cancel-in-progress: false

jobs:
  update-holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check if already succeeded today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python scripts/check_workflow_success_today.py --workflow daily-holdings.yml; then
            echo "already_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.already_run != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.guard.outputs.already_run != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml requests pandas pykrx

      - name: Run holdings scraper
        if: steps.guard.outputs.already_run != 'true'
        run: python scripts/refresh_holdings.py

      - name: Commit and push changes
        if: steps.guard.outputs.already_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/holdings/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily ETF holdings [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }} && break || sleep 5
            done
          else
            echo "No holdings changes detected."
          fi
