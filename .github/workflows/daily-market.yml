name: Daily ETF market data refresh

# Note: Automated scheduled execution is driven with 0-second precision by the NHN Cloud n8n instance
# (scripts/n8n/daily_market_probing_workflow.json, 5-min intervals between 07:50 and 09:10 KST Tue-Sat)
# to completely eliminate GitHub Actions 15-45min cron queuing delays.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target date in YYYYMMDD (blank uses yesterday)"
        required: false
        type: string
      force:
        description: "Force rerun even if already succeeded today"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [market_data_ready]

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-market
  # Keep one refresh at a time. A manual retry must not cancel a nearly
  # completed data commit; the job-level timeout still bounds stalled runs.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Price collection is usually fast. The added distribution source capture
    # needs a larger ceiling but still fails rather than holding a runner.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pre-flight check & Guard
        id: guard
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If manual run with explicit TARGET_DATE, bypass pre-flight check
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.target }}" ]; then
            echo "Manual run with explicit target date (${{ inputs.target }}) detected. Bypassing pre-flight checks."
            exit 0
          fi
          
          # 1. Check if already succeeded today (skip for automated/scheduled runs without force)
          if [ "${{ inputs.force }}" != "true" ] && { [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ -z "${{ inputs.target }}" ]; }; then
            if python scripts/check_workflow_success_today.py --workflow daily-market.yml; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "skip_reason=already_succeeded" >> "$GITHUB_OUTPUT"
              echo "✅**Skipping**: This workflow has already succeeded today." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          
          # 2. Check data source readiness and trading day status
          set +e
          python scripts/check_source_ready.py
          source_exit=$?
          set -e
          if [ "$source_exit" -eq 0 ]; then
            echo "Data is ready."
            echo "- **Proceeding**: Source data is available." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$source_exit" -eq 3 ] || [ "$source_exit" -eq 4 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=market_closed" >> "$GITHUB_OUTPUT"
            echo "- **Skipping**: Yesterday was a weekend or Korean market holiday. No newly closed market session to collect." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "Data not available yet on KRX Open API. Skipping to release runner lock."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=source_not_ready" >> "$GITHUB_OUTPUT"
            echo "- **Skipping**: Source data is not yet available. Exiting early to await next polling probe." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Install Python dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 certifi requests xlrd curl_cffi "pydantic>=2.0" pytest


      - name: Refresh official ETF data
        if: steps.guard.outputs.skip != 'true'
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          TARGET_DATE: ${{ inputs.target }}
        run: |
          # Scheduled runs always take the default path: newest available close,
          # falling back to the prior trading day. Only an explicit manual target
          # pins an exact date (and fails loudly when that date is not published).
          if [ -n "$TARGET_DATE" ]; then
            python scripts/update_daily_data.py --target "$TARGET_DATE" --require-exact-date
          else
            python scripts/update_daily_data.py
          fi

      - name: Detect recent-listing reference-price work
        if: steps.guard.outputs.skip != 'true'
        id: listing_reference
        run: |
          AS_OF_DATE=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo(\"Asia/Seoul\")).date().isoformat())")
          echo "as_of_date=$AS_OF_DATE" >> "$GITHUB_OUTPUT"
          python scripts/detect_listing_reference_work.py "$AS_OF_DATE" >> "$GITHUB_OUTPUT"
      - name: Refresh recent-listing official reference prices and ITD
        if: steps.guard.outputs.skip != 'true' && (steps.listing_reference.outputs.required == 'true')
        run: |
          AS_OF_DATE=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo(\"Asia/Seoul\")).date().isoformat())")
          python scripts/rebuild_listing_reference_prices.py \
            --data-dir data \
            --recent-listings-only --recent-days 90 --as-of-date "$AS_OF_DATE" \
            --retry-unverified \
            --apply --apply-returns --apply-listing-cache --purge-nonrecent \
            --throttle-seconds 1.5

      - name: Sync newly listed ETF nominal fees
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/collector/sync_new_listing_fee.py
      - name: Check snapshot freshness
        if: steps.guard.outputs.skip != 'true'
        id: freshness
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            actual_date=$(python -c "import csv; print(next(csv.DictReader(open('data/etf_master_draft.csv', encoding='utf-8-sig')))['bas_dt'])")
            if [ "$actual_date" = "$TARGET_DATE" ]; then
              freshness_exit=0
            else
              echo "::error::Requested ${TARGET_DATE}, but the snapshot contains ${actual_date}."
              freshness_exit=1
            fi
          else
            set +e
            python scripts/check_data_freshness.py
            freshness_exit=$?
            set -e
          fi
          if [ "$freshness_exit" -eq 0 ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot is current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The official close is not available yet. The next hourly schedule will retry."
            echo "Snapshot is still stale; the next hourly schedule will retry." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Refresh classification review draft
        if: steps.guard.outputs.skip != 'true' && (steps.freshness.outputs.fresh == 'true')
        run: python scripts/build_classification_review.py

      - name: Classify new listings via regulatory engine & sync personal pension & onboard taxonomy
        if: steps.guard.outputs.skip != 'true' && (steps.freshness.outputs.fresh == 'true')
        run: |
          python scripts/rules/pension_regulatory_engine.py
          python scripts/pipeline/sync_kofia_personal_pension.py
          python scripts/pipeline/onboard_new_etfs.py

      - name: Calculate Total Returns (TR Index)
        if: steps.guard.outputs.skip != 'true' && (steps.freshness.outputs.fresh == 'true')
        run: |
          python scripts/append_daily_prices.py
          python scripts/calculate_daily_tr_index.py
          python scripts/calculate_total_returns.py
          python scripts/build_distribution_summaries.py

      - name: Build v2 price series (quarantine gate, fail-closed)
        if: steps.guard.outputs.skip != 'true' && (steps.freshness.outputs.fresh == 'true')
        run: python scripts/generate_series_v2.py --fail-on-quarantine

      - name: Audit v2 series price integrity (SSOT the chart consumes)
        if: steps.guard.outputs.skip != 'true' && (steps.freshness.outputs.fresh == 'true')
        run: python scripts/verify_split_adjustment.py --series-dir public/data/series/v2

      # Only the retry rung that actually receives a new official close runs
      # the distribution pipeline. This keeps it coupled to the 06:17 KST
      # attempt while allowing a later retry to recover from a delayed feed.
      - name: Detect price snapshot changes
        if: steps.guard.outputs.skip != 'true'
        id: snapshot_changes
        run: |
          if git diff --quiet -- data/etf_master_draft.csv data/etf_returns_draft.csv data/pension_verify_sheet.csv data/classification; then
            echo "No new price snapshot. Skipping distribution refresh."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New price snapshot detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch global market indices
        if: steps.guard.outputs.skip != 'true'
        env:
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/fetch_market_indices.py

      - name: Detect publishable data changes
        if: steps.guard.outputs.skip != 'true'
        id: changes
        run: |
          if git status --porcelain --untracked-files=all -- data/market_indices.json data/etf_master_draft.csv data/etf_returns_draft.csv data/pension_verify_sheet.csv data/classification data/comparison workers/market-briefing-publisher/src/taxonomy-map.ts data/returns data/distributions data/corporate_actions data/fees public/data/returns/tr_index public/data/series/v2 | grep -q .; then
            echo "Publishable data changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes. Skipping validation and commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          latest_bas_dt=$(python -c 'import csv; print(next(csv.DictReader(open("data/etf_master_draft.csv", encoding="utf-8-sig")))["bas_dt"])')
          echo "Latest bas_dt: ${latest_bas_dt}"

      - name: Validate refreshed data integrity
        if: steps.guard.outputs.skip != 'true' && (steps.changes.outputs.changed == 'true')
        run: |
          python -m unittest discover -s scripts/tests
          python scripts/verify_zero_hallucination.py
          python scripts/rules/validate_pension_consistency.py
          python scripts/rules/validate_evidence_integrity.py
          python scripts/rules/validate_covered_call_distribution.py

      - name: Record issuer coverage closure (tracking update)
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/rules/validate_issuer_coverage.py --record-only

      - name: Build local briefing payload snapshot (Canonical SSOT)
        if: steps.guard.outputs.skip != 'true' && (steps.changes.outputs.changed == 'true')
        run: python scripts/build_local_briefing_payload.py

      - name: Regenerate public screener and search index
        if: steps.guard.outputs.skip != 'true' && (steps.changes.outputs.changed == 'true')
        run: npx --yes tsx scripts/generate-screener-json.ts

      - name: Ingest daily ETF prices to D1 (Downstream Consumer)
        continue-on-error: true
        if: steps.guard.outputs.skip != 'true' && (steps.freshness.outputs.fresh == 'true' && steps.snapshot_changes.outputs.changed == 'true')
        env:
          PRICE_INGEST_ENDPOINT: ${{ secrets.PRICE_INGEST_ENDPOINT }}
          PRICE_INGEST_HMAC_SECRET: ${{ secrets.PRICE_INGEST_HMAC_SECRET }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
        run: |
          BAS_DT=$(python -c "import csv; print(next(csv.DictReader(open('data/etf_master_draft.csv', encoding='utf-8-sig')))['bas_dt'])")
          python scripts/backfill_api.py --start-date "$BAS_DT" --end-date "$BAS_DT" --source krx
          python scripts/validate_d1_status.py "$BAS_DT"

      - name: Apply unapplied D1 migrations
        continue-on-error: true
        if: steps.guard.outputs.skip != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          npx --yes wrangler@4.124.0 d1 migrations apply etf-prices --remote

      - name: Publish canonical market-source snapshot to D1
        # Run even when the repository snapshot did not change so a previously failed
        # source-hub ingest can recover without another external API collection.
        continue-on-error: true
        if: steps.guard.outputs.skip != 'true' && (steps.freshness.outputs.fresh == 'true')
        env:
          PRICE_INGEST_HMAC_SECRET: ${{ secrets.PRICE_INGEST_HMAC_SECRET }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/publish_market_source_snapshot.py --skip-trigger

      # [Worker D1 Retirement Step 1] Severed legacy market-briefing-publisher trigger.
      # build_local_briefing_payload.py -> sync_osmu_kv.py is the sole SSOT for KV publication.
      # - name: Trigger market briefing publication event (RETIRED)
      #   if: steps.guard.outputs.skip != 'true' && (steps.freshness.outputs.fresh == 'true')
      #   env:
      #     MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
      #   run: python scripts/publish_market_source_snapshot.py --trigger-only

      - name: Commit refreshed market data
        if: steps.guard.outputs.skip != 'true' && (steps.changes.outputs.changed == 'true')
        run: |
          git config user.name "etf-campus-data-bot"
          git config user.email "etf-campus-data-bot@users.noreply.github.com"
          for file in data/snapshots data/briefing_payload_*.json data/briefing_payload_latest.json data/market_indices.json data/etf_master_draft.csv data/etf_returns_draft.csv data/pension_verify_sheet.csv data/classification data/comparison workers/market-briefing-publisher/src/taxonomy-map.ts data/returns data/distributions data/corporate_actions data/fees data/listing_prices.json data/listing-ledger/etf_listing_reference_prices.csv data/quality/krx_listing_reference_price_audit.csv data/quality/krx_listing_reference_price_checkpoint.json data/regulatory/unexplained_coverage.json data/regulatory/personal_pension_registry.json public/data/screener.json public/data/returns/tr_index public/data/series/v2 data/reports/pension_unverified_queue.csv data/reports/pension_verification_summary.json; do
            if [ -e "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh ETF snapshot"
            PUSHED=false
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }}; then
                PUSHED=true
                break
              fi
              sleep 5
            done
            if [ "$PUSHED" != "true" ]; then
              echo "::error::Failed to push refreshed market data to origin/${{ github.ref_name }}"
              exit 1
            fi
          fi

      - name: Validate issuer coverage closure (pre-deploy gate)
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/rules/validate_issuer_coverage.py --check-only

      - name: Pre-deploy briefing quality gate
        id: quality_gate
        if: steps.guard.outputs.skip != 'true' && (steps.changes.outputs.changed == 'true')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_TOKEN }}
        run: python scripts/validate_briefing_gate.py

      - name: Trigger fast OSMU generation
        if: steps.guard.outputs.skip != 'true' && (steps.changes.outputs.changed == 'true') && (steps.quality_gate.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bas_dt=$(python -c "import csv; print(next(csv.DictReader(open('data/etf_master_draft.csv', encoding='utf-8-sig')))['bas_dt'])")
          formatted_bas_dt="${bas_dt:0:4}-${bas_dt:4:2}-${bas_dt:6:2}"
          echo "Triggering fast OSMU generation workflow for target date: ${formatted_bas_dt}..."
          gh workflow run generate-osmu.yml --ref "${{ github.ref_name }}" -f target_date="${formatted_bas_dt}"
          echo "Triggered OSMU workflow for branch ${{ github.ref_name }}."

      - name: Write refresh summary
        if: always() && steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          bas_dt=$(python -c "import csv; print(next(csv.DictReader(open('data/etf_master_draft.csv', encoding='utf-8-sig')))['bas_dt'])")
          {
            echo "### ETF data refresh"
            echo "- Snapshot date: ${bas_dt}"
            echo "- Fresh: ${{ steps.freshness.outputs.fresh || 'unknown' }}"
            echo "- Price snapshot changed: ${{ steps.snapshot_changes.outputs.changed || 'unknown' }}"
                                    echo "- Repository data changed: ${{ steps.changes.outputs.changed || 'unknown' }}"
            echo "- Trigger: ${{ github.event_name }} / ${{ github.event.schedule || 'manual' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # A run can end green while the site quietly serves stale prices: if the
      # feed has not published, the collector falls back to the previous close
      # and reports no change. Mark each stale rung as failed so Actions shows
      # the actual state; the next hourly schedule still runs independently.
      #
      # Weekday market holidays live in data/market_holidays.txt. The first
      # unlisted holiday will trip this check once; add the date and it is
      # accurate again.
      - name: Mark stale attempt as failed and await next hourly retry
        if: steps.guard.outputs.skip != 'true' && (steps.freshness.outputs.fresh != 'true')
        run: |
          echo "Official ETF close is still unavailable. A later hourly schedule will retry." >&2
          exit 1

      - name: Send Telegram Alert on Pipeline Failure
        if: failure() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
        run: python3 scripts/notify_telegram_osmu.py --failure --reason="데이터 적재 또는 브리핑 품질 게이트 차단"




