name: Generate and Publish OSMU Archive

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target market briefing date (YYYY-MM-DD), defaults to latest"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: etf-campus-osmu-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
  PAGES_PROJECT_NAME: etf-campus
  WRANGLER_VERSION: 4.124.0

jobs:
  generate_osmu:
    name: Generate OSMU Archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            workers/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Korean Fonts and Chrome for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-nanum-coding fonts-nanum-extra
          npx puppeteer browsers install chrome

      - name: Wait for API to serve latest data
        run: |
          echo "Checking if latest API briefing is ready..."
          INPUT_DATE="${{ inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE=$(echo "$INPUT_DATE" | tr -d '-')
          else
            TARGET_DATE=$(python3 -c "import csv; print(next(csv.DictReader(open('data/etf_master_draft.csv', encoding='utf-8-sig')))['bas_dt'])")
          fi
          echo "Target Date: $TARGET_DATE"
          python3 -c "
import json, sys, time, urllib.request

target = sys.argv[1].replace('-', '').strip()
print(f'Waiting for API to serve target date: {target}')
for i in range(1, 21):
    try:
        url = f'https://etf-campus.pages.dev/api/briefings/latest?_t={time.time()}'
        req = urllib.request.Request(url, headers={'User-Agent': 'ETF-Campus-CI/1.0'})
        with urllib.request.urlopen(req, timeout=15) as resp:
            data = json.loads(resp.read().decode('utf-8'))
            as_of = (data.get('briefing', {}).get('asOfDate') or data.get('asOfDate') or '').replace('-', '').strip()
            if as_of == target:
                print(f'✅ API is live with target date {target}! Proceeding...')
                sys.exit(0)
            print(f'Latest API date is {as_of}. Still waiting... ({i}/20)')
    except Exception as e:
        print(f'Attempt {i} error: {e}')
    time.sleep(10)

print(f'⚠️ Timeout waiting for target date {target}. Proceeding with best effort.')
sys.exit(0)
" "$TARGET_DATE"

      - name: Generate OSMU Assets
        working-directory: workers/market-briefing-distributor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
        run: |
          INPUT_DATE="${{ inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            npx tsx render-instagram.ts --render-only --date="$INPUT_DATE"
          else
            npx tsx render-instagram.ts --render-only
          fi

      - name: Upload Briefing Images (Threads & Instagram Carousel) to Cloudflare KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          INPUT_DATE="${{ inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            python3 scripts/sync_osmu_kv.py --date="$INPUT_DATE"
          else
            python3 scripts/sync_osmu_kv.py
          fi

      - name: Send Telegram OSMU Notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/notify_telegram_osmu.py

      - name: Upload OSMU Archive
        uses: actions/upload-artifact@v4
        with:
          name: OSMU_Archive
          path: OSMU_Archive
          retention-days: 30
