name: Generate and Publish OSMU Archive

# Note: Scheduled execution is driven with 0-second precision by the NHN Cloud n8n instance
# (scripts/n8n/osmu_scheduled_publishing_workflow.json) to eliminate GitHub Actions 15-45min cron queuing delays.
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target market briefing date (YYYY-MM-DD), defaults to latest"
        required: false
        type: string
      auto_publish:
        description: "Automatically publish to 3 channels (Threads, Newsletter, Instagram)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: etf-campus-osmu-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
  PAGES_PROJECT_NAME: etf-campus
  WRANGLER_VERSION: 4.124.0

jobs:
  generate_osmu:
    name: Generate OSMU Archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests "pydantic>=2.0"


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            workers/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Korean and Color Emoji Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fonts-nanum fonts-noto-color-emoji

      - name: Verify or wait for market briefing data readiness
        continue-on-error: true
        run: python3 scripts/wait_for_briefing_api.py "${{ inputs.target_date }}"

      - name: Generate OSMU Assets
        working-directory: workers/market-briefing-distributor
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
        run: |
          INPUT_DATE="${{ inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            npx tsx render-instagram.ts --render-only --date="$INPUT_DATE"
          else
            npx tsx render-instagram.ts --render-only
          fi

      - name: Upload Briefing Images (Threads & Instagram Carousel) to Cloudflare KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
        run: |
          INPUT_DATE="${{ inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            python3 scripts/sync_osmu_kv.py --date="$INPUT_DATE"
          else
            python3 scripts/sync_osmu_kv.py
          fi

      - name: Auto-Publish Multi-Channel Distribution (Threads, Newsletter, Instagram)
        if: ${{ inputs.auto_publish != false }}
        env:
          MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NEWSLETTER_TO_EMAIL: ${{ secrets.SMTP_USER }}
        run: |
          INPUT_DATE="${{ inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            python3 scripts/publish_osmu_channels.py --date="$INPUT_DATE"
          else
            python3 scripts/publish_osmu_channels.py
          fi

      - name: Send Telegram OSMU Notification (Success)
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
        run: python3 scripts/notify_telegram_osmu.py

      - name: Send Telegram Failure Alert (Stopped Midway)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
        run: |
          INPUT_DATE="${{ inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            python3 scripts/notify_telegram_osmu.py --failure --date="$INPUT_DATE" --reason="OSMU 에셋 렌더링 또는 채널 배포 중단"
          else
            python3 scripts/notify_telegram_osmu.py --failure --reason="OSMU 에셋 렌더링 또는 채널 배포 중단"
          fi

      - name: Upload OSMU Archive
        uses: actions/upload-artifact@v4
        with:
          name: OSMU_Archive
          path: OSMU_Archive
          retention-days: 30
