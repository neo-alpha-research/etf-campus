name: Generate and Publish OSMU Archive

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target market briefing date (YYYY-MM-DD), defaults to latest"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: etf-campus-osmu-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
  PAGES_PROJECT_NAME: etf-campus
  WRANGLER_VERSION: 4.124.0

jobs:
  generate_osmu:
    name: Generate OSMU Archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            workers/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Korean Fonts and Chrome for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-nanum-coding fonts-nanum-extra
          npx puppeteer browsers install chrome

      - name: Wait for API to serve latest data
        run: python3 scripts/wait_for_briefing_api.py "${{ inputs.target_date }}"

      - name: Generate OSMU Assets
        working-directory: workers/market-briefing-distributor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
        run: |
          INPUT_DATE="${{ inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            npx tsx render-instagram.ts --render-only --date="$INPUT_DATE"
          else
            npx tsx render-instagram.ts --render-only
          fi

      - name: Upload Briefing Images (Threads & Instagram Carousel) to Cloudflare KV
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          INPUT_DATE="${{ inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            python3 scripts/sync_osmu_kv.py --date="$INPUT_DATE"
          else
            python3 scripts/sync_osmu_kv.py
          fi

      - name: Send Telegram OSMU Notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/notify_telegram_osmu.py

      - name: Upload OSMU Archive
        uses: actions/upload-artifact@v4
        with:
          name: OSMU_Archive
          path: OSMU_Archive
          retention-days: 30
