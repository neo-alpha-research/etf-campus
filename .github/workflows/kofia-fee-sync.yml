name: KOFIA Fee Registry Auto-Sync

on:
  schedule:
    # 매월 1일, 5일, 10일 오전 2시 UTC (KST 기준 오전 11시) 실행
    # (월초 결산 제출 시차 및 휴일 대응 3단계 정기 동기화)
    - cron: '0 2 1,5,10 * *'
  workflow_dispatch: # 수동 실행 트리거

permissions:
  contents: write
  actions: write

concurrency:
  group: kofia-fee-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python and Playwright Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas requests
          playwright install --with-deps chromium

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🔄 Run KOFIA Scraping Pipeline (with Retry)
        id: scrape
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            if npx tsx scripts/sync-kofia-fees.ts; then
              echo "Pipeline succeeded!"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Attempt $i failed. Waiting 5 minutes before retrying..."
              sleep 300
            fi
          done
          echo "Pipeline failed after 3 attempts."
          exit 1
        env:
          NODE_ENV: production

      - name: 🚨 Notify Slack on Failure
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚨 [ETF Campus] KOFIA 실부담비용 파이프라인 실패 (서킷 브레이커 발동 의심)"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true
          fi

      - name: 📦 Archive Raw KOFIA XML Response (30 Days Retention)
        uses: actions/upload-artifact@v4
        with:
          name: kofia-raw-xml-snapshot
          path: data/regulatory/sources/kofia_dis_response_*.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: 💾 Commit and Push Changes directly to Main
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add --ignore-missing \
                  data/fees/etf_fee_registry.json \
                  data/regulatory/kofia_fund_types.csv \
                  data/regulatory/pension_verification_ledger.csv \
                  data/regulatory/personal_pension_registry.json \
                  data/regulatory/sources/kofia_evidence_extract_*.xml \
                  data/regulatory/sources/evidence_manifest.json \
                  data/reports/pension_unverified_queue.csv \
                  data/reports/pension_verification_summary.json \
                  data/etf_master_draft.csv \
                  public/data/screener.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): 🤖 KOFIA 월간 실부담비용 및 연금적격성 공시대조 자동 동기화 완료 [skip ci]"
            PUSHED=false
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push origin main; then
                PUSHED=true
                break
              fi
              sleep 5
            done
            if [ "$PUSHED" != "true" ]; then
              echo "::error::Failed to push KOFIA sync updates"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Trigger production deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run market-briefing-production.yml --ref main
          echo "Triggered production deployment for KOFIA update."

      - name: ✅ Notify Slack on Success
        if: steps.commit.outputs.changed == 'true'
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ [ETF Campus] KOFIA 실부담비용 및 연금적격성 공시대조 자동 동기화 완료!"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true
          fi
