name: KOFIA Fee Registry Auto-Sync

on:
  schedule:
    # 매월 1일 오전 2시 (KST 기준 오전 11시) 실행
    - cron: '0 2 1 * *'
  workflow_dispatch: # 수동 실행 트리거

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔄 Run KOFIA Scraping Pipeline (with Retry)
        id: scrape
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            if npx tsx scripts/sync-kofia-fees.ts; then
              echo "Pipeline succeeded!"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Attempt $i failed. Waiting 5 minutes before retrying..."
              sleep 300
            fi
          done
          echo "Pipeline failed after 3 attempts."
          exit 1
        env:
          NODE_ENV: production
          # KOFIA_ID: ${{ secrets.KOFIA_ID }} (필요 시)

      - name: 🚨 Notify Slack on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🚨 [ETF Campus] KOFIA 실부담비용 파이프라인 실패 (서킷 브레이커 발동 의심)"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 💾 Commit and Push Changes directly to Main
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/fees/etf_fee_registry.json \
                  data/regulatory/kofia_fund_types.csv \
                  data/regulatory/pension_verification_ledger.csv \
                  data/reports/pension_unverified_queue.csv \
                  data/reports/pension_verification_summary.json \
                  data/etf_master_draft.csv
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): 🤖 KOFIA 월간 실부담비용 및 연금적격성 공시대조 자동 동기화 완료"
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: ♻️ Revalidate Next.js Cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -X POST "https://etfcampus.com/api/revalidate?tag=etf-fees" \
          -H "Authorization: Bearer ${{ secrets.REVALIDATION_SECRET }}"

      - name: ✅ Notify Slack on Success
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ [ETF Campus] KOFIA 실부담비용 월간 업데이트 완료 및 캐시 무효화 성공!"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
