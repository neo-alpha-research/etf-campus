name: Deploy market briefing production

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: etf-campus-production
  # A newer commit must not cancel a production migration or a partially completed
  # worker rollout. The next queued deployment runs only after this one finishes.
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PAGES_PROJECT_NAME: etf-campus
  WRANGLER_VERSION: 4.124.0

jobs:
  validate:
    name: Validate application and workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            workers/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build web application
        run: npm run build

      - name: Upload static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-out-${{ github.run_id }}
          path: out/
          retention-days: 1

      - name: Validate publisher Worker
        working-directory: workers/market-briefing-publisher
        run: npm run typecheck

      - name: Validate distributor Worker
        working-directory: workers/market-briefing-distributor
        run: npm run typecheck

  migrate_d1:
    name: Apply production D1 migrations
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Capture pre-migration D1 recovery bookmark
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} d1 time-travel info etf-prices |
            tee d1-time-travel-bookmark-before-migration.txt

      - name: Upload D1 recovery bookmark
        uses: actions/upload-artifact@v4
        with:
          name: d1-time-travel-bookmark-${{ github.run_id }}
          path: d1-time-travel-bookmark-before-migration.txt
          retention-days: 30

      - name: Apply pending migrations
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} d1 migrations apply etf-prices --remote

  deploy_publisher:
    name: Deploy market briefing publisher
    needs: migrate_d1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for publisher changes
        id: check_changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger: deploying publisher."
          else
            DIFF=$(git diff --name-only HEAD~1 HEAD -- workers/market-briefing-publisher/ || true)
            if [ -n "$DIFF" ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              echo "Changes detected in publisher worker: $DIFF"
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "No changes in publisher worker; skipping deploy."
            fi
          fi

      - name: Deploy publisher
        if: steps.check_changes.outputs.should_deploy == 'true'
        working-directory: workers/market-briefing-publisher
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --env=""

  deploy_distributor:
    name: Deploy market briefing distributor (OSMU)
    needs: migrate_d1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for distributor changes
        id: check_changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger: deploying distributor."
          else
            DIFF=$(git diff --name-only HEAD~1 HEAD -- workers/market-briefing-distributor/ || true)
            if [ -n "$DIFF" ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              echo "Changes detected in distributor worker: $DIFF"
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "No changes in distributor worker; skipping deploy."
            fi
          fi

      - name: Deploy distributor
        if: steps.check_changes.outputs.should_deploy == 'true'
        working-directory: workers/market-briefing-distributor
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --env=""

  deploy_pages:
    name: Deploy ETF Campus Pages
    needs: [validate, deploy_publisher, deploy_distributor]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download static export artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-out-${{ github.run_id }}
          path: out

      - name: Deploy Pages assets and Functions
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy out --project-name=${{ env.PAGES_PROJECT_NAME }}

  generate_osmu_archive:
    name: Generate OSMU Archive
    needs: deploy_pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            workers/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Korean Fonts for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-nanum-coding fonts-nanum-extra

      - name: Wait for API to serve latest data
        run: |
          echo "Waiting for Cloudflare Pages to flush cache and serve the latest API..."
          TARGET_DATE=$(python3 -c "import csv; print(next(csv.DictReader(open('data/etf_master_draft.csv', encoding='utf-8-sig')))['bas_dt'])")
          echo "Target Date: $TARGET_DATE"
          for i in {1..20}; do
            LATEST_DATE=$(curl -s "https://etf-campus.pages.dev/api/briefings/latest?_t=$(date +%s)" | jq -r '(.briefing.asOfDate // .asOfDate // "") | gsub("-"; "")')
            if [ "$LATEST_DATE" == "$TARGET_DATE" ]; then
              echo "Deployment is live with target date $TARGET_DATE! Proceeding..."
              break
            fi
            echo "Latest is $LATEST_DATE. Still waiting... ($i/20)"
            sleep 15
          done

      - name: Generate OSMU Assets
        working-directory: workers/market-briefing-distributor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: npx tsx generate-osmu.ts

      - name: Upload Threads PNG Image to Cloudflare KV
        working-directory: workers/market-briefing-distributor
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FORMATTED_DATE=$(python3 -c "import csv; b=next(csv.DictReader(open('../../data/etf_master_draft.csv', encoding='utf-8-sig')))['bas_dt']; print(f'{b[:4]}-{b[4:6]}-{b[6:]}')")
          echo "Uploading threads_image.png for $FORMATTED_DATE to BRIEFING_KV..."
          if [ -f "../../OSMU_Archive/$FORMATTED_DATE/2_Threads/threads_image.png" ]; then
            npx wrangler kv key put "image:threads:$FORMATTED_DATE" --binding=BRIEFING_KV --remote --path="../../OSMU_Archive/$FORMATTED_DATE/2_Threads/threads_image.png"
          fi

      - name: Upload OSMU Archive
        uses: actions/upload-artifact@v4
        with:
          name: OSMU_Archive
          path: OSMU_Archive
          retention-days: 30

      - name: Trigger n8n OSMU Marketing Automation Webhook
        continue-on-error: true
        run: |
          TARGET_DATE=$(python3 -c "import csv; print(next(csv.DictReader(open('data/etf_master_draft.csv', encoding='utf-8-sig')))['bas_dt'])")
          echo "Triggering n8n OSMU automation for date: $TARGET_DATE"
          curl -X POST https://n8n.aitestbed.kr/webhook/osmu-trigger \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"success\", \"date\": \"$TARGET_DATE\"}" || true

