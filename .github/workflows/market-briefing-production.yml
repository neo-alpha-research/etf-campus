name: Deploy market briefing production

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: etf-campus-production
  # A newer commit must not cancel a production migration or a partially completed
  # worker rollout. The next queued deployment runs only after this one finishes.
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PAGES_PROJECT_NAME: etf-campus
  WRANGLER_VERSION: 4.124.0

jobs:
  validate:
    name: Validate application and workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/market-briefing-publisher/package-lock.json

      - name: Install web application dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Validate web application
        run: |
          npm run lint
          npm test
          npm run build

      - name: Install and validate publisher Worker
        working-directory: workers/market-briefing-publisher
        run: |
          npm ci
          npm run typecheck

  migrate_d1:
    name: Apply production D1 migrations
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Capture pre-migration D1 recovery bookmark
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} d1 time-travel info etf-prices |
            tee d1-time-travel-bookmark-before-migration.txt

      - name: Upload D1 recovery bookmark
        uses: actions/upload-artifact@v4
        with:
          name: d1-time-travel-bookmark-${{ github.run_id }}
          path: d1-time-travel-bookmark-before-migration.txt
          retention-days: 30

      - name: Apply pending migrations
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} d1 migrations apply etf-prices --remote

  deploy_publisher:
    name: Deploy market briefing publisher
    needs: migrate_d1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install publisher dependencies
        working-directory: workers/market-briefing-publisher
        run: npm ci

      - name: Deploy publisher
        working-directory: workers/market-briefing-publisher
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy

  deploy_pages:
    name: Deploy ETF Campus Pages
    needs: deploy_publisher
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build production assets
        run: |
          npm ci
          npm run build

      - name: Deploy Pages assets and Functions
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy out --project-name=${{ env.PAGES_PROJECT_NAME }}
