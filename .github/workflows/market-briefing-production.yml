name: Deploy market briefing production

on:
  workflow_dispatch:
    inputs:
      force_deploy_workers:
        description: "Force deploy workers regardless of hash cache"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

concurrency:
  group: etf-campus-production
  # A newer commit must not cancel a production migration or a partially completed
  # worker rollout. The next queued deployment runs only after this one finishes.
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PAGES_PROJECT_NAME: etf-campus
  WRANGLER_VERSION: 4.124.0

jobs:
  validate:
    name: Validate application and workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            workers/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build web application
        run: npm run build

      - name: Upload static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-out-${{ github.run_id }}
          path: out/
          retention-days: 1

      - name: Validate publisher Worker
        working-directory: workers/market-briefing-publisher
        run: npm run typecheck

      - name: Validate distributor Worker
        working-directory: workers/market-briefing-distributor
        run: npm run typecheck

  migrate_d1:
    name: Apply production D1 migrations
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Capture pre-migration D1 recovery bookmark
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} d1 time-travel info etf-prices |
            tee d1-time-travel-bookmark-before-migration.txt

      - name: Upload D1 recovery bookmark
        uses: actions/upload-artifact@v4
        with:
          name: d1-time-travel-bookmark-${{ github.run_id }}
          path: d1-time-travel-bookmark-before-migration.txt
          retention-days: 30

      - name: Apply pending migrations
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} d1 migrations apply etf-prices --remote

  deploy_publisher:
    name: Deploy market briefing publisher
    needs: migrate_d1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check deployment cache for publisher
        id: cache_publisher
        uses: actions/cache@v4
        with:
          path: .publisher-deploy-marker
          key: deployed-worker-publisher-${{ hashFiles('workers/market-briefing-publisher/**') }}

      - name: Deploy publisher
        if: steps.cache_publisher.outputs.cache-hit != 'true' || inputs.force_deploy_workers == true
        working-directory: workers/market-briefing-publisher
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --env=""

      - name: Save deployment marker for publisher
        if: steps.cache_publisher.outputs.cache-hit != 'true' || inputs.force_deploy_workers == true
        run: |
          mkdir -p .publisher-deploy-marker
          echo "deployed at $(date -u)" > .publisher-deploy-marker/deployed.txt

  deploy_distributor:
    name: Deploy market briefing distributor (OSMU)
    needs: migrate_d1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check deployment cache for distributor
        id: cache_distributor
        uses: actions/cache@v4
        with:
          path: .distributor-deploy-marker
          key: deployed-worker-distributor-${{ hashFiles('workers/market-briefing-distributor/**') }}

      - name: Deploy distributor
        if: steps.cache_distributor.outputs.cache-hit != 'true' || inputs.force_deploy_workers == true
        working-directory: workers/market-briefing-distributor
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --env=""

      - name: Save deployment marker for distributor
        if: steps.cache_distributor.outputs.cache-hit != 'true' || inputs.force_deploy_workers == true
        run: |
          mkdir -p .distributor-deploy-marker
          echo "deployed at $(date -u)" > .distributor-deploy-marker/deployed.txt

  deploy_pages:
    name: Deploy ETF Campus Pages
    needs: [validate, deploy_publisher, deploy_distributor]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download static export artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-out-${{ github.run_id }}
          path: out

      - name: Deploy Pages assets and Functions
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy out --project-name=${{ env.PAGES_PROJECT_NAME }}

