name: Pipeline Integrity

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch origin main for cron workflow scheduling check (FM-010)
        run: git fetch origin main --depth=1 || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pipeline Integrity Linter
        run: python scripts/lint_pipeline.py

      - name: Pipeline Integrity Linter Tests
        run: python -m unittest scripts/tests/test_lint_pipeline.py

      - name: Check Pages Deployment Tests
        run: python -m unittest scripts/tests/test_check_pages_deployment.py
