name: Threads daily post generation

on:
  schedule:
    # 매일 KST 06:00 (= UTC 21:00 전날) — 오전 골든타임 대비
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "대상 날짜 (YYYY-MM-DD). 비워두면 오늘 KST 기준."
        required: false
        type: string
      dry_run:
        description: "Dry-run 모드 (저장 없이 미리보기)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-thread:
    name: Generate daily Threads post
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve target date (KST)
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date }}"
          else
            TARGET_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          fi
          echo "TARGET_DATE=$TARGET_DATE" >> $GITHUB_ENV
          echo "[INFO] Target date: $TARGET_DATE"

      - name: Generate Threads post
        if: github.event.inputs.dry_run != 'true'
        run: |
          cd scripts/threads
          python generate_thread.py --date "${{ env.TARGET_DATE }}"
        env:
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TOKENS: ${{ secrets.GEMINI_TOKENS }}

      - name: Generate Threads post (dry-run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          cd scripts/threads
          python generate_thread.py --date "${{ env.TARGET_DATE }}" --dry-run
        env:
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TOKENS: ${{ secrets.GEMINI_TOKENS }}

      - name: Check for changes
        if: github.event.inputs.dry_run != 'true'
        id: changes
        run: |
          if git diff --quiet scripts/threads/threads_bank.json; then
            echo "CHANGED=false" >> $GITHUB_ENV
          else
            echo "CHANGED=true" >> $GITHUB_ENV
          fi

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true' && env.CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/threads/threads_bank.json
          git commit -m "feat(threads): generate daily post for ${{ env.TARGET_DATE }} [skip ci]"
          git pull origin feat/threads-automation --rebase
          git push origin feat/threads-automation

      - name: Report result
        if: always()
        run: |
          echo "=== Threads Post Generation Report ==="
          echo "Date     : ${{ env.TARGET_DATE }}"
          echo "Dry-run  : ${{ github.event.inputs.dry_run }}"
          python - <<'PYEOF'
          import json
          try:
              with open("scripts/threads/threads_bank.json", encoding="utf-8") as f:
                  d = json.load(f)
              total = len(d["posts"])
              print(f"Total posts generated : {total}")
              if d["posts"]:
                  latest = d["posts"][-1]
                  print(f"Latest   : {latest['date']} @ KST {latest['publish_time_kst']}")
                  print(f"Format   : {latest['format_type']}")
                  print(f"Topic    : {latest['source_topic_id']}")
                  print(f"Method   : {latest.get('generation_method', 'unknown')}")
                  print(f"Chars    : {latest['char_count']}")
          except Exception as e:
              print(f"Report error: {e}")
          PYEOF
