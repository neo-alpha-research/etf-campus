name: Verify market briefing event hub preview

on:
  workflow_dispatch:
  push:
    branches:
      - feat/market-briefing-ui
    paths:
      - .github/workflows/verify-market-briefing-event-hub-preview.yml
      - workers/market-event-dispatcher/wrangler.toml

permissions:
  contents: read

concurrency:
  group: market-briefing-event-hub-preview
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  MARKET_SOURCE_INGEST_ENDPOINT: https://feat-market-briefing-ui.etf-campus.pages.dev/api/internal/ingest-market-source
  MARKET_EVENT_DISPATCHER_ENDPOINT: https://market-event-dispatcher-preview.neo-alpha-research.workers.dev/internal/dispatch
  WRANGLER_VERSION: 4.124.0

jobs:
  verify:
    name: Publish existing snapshot and assert consumer path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Publish existing validated ETF master into preview source hub
        env:
          PRICE_INGEST_HMAC_SECRET: ${{ secrets.PRICE_INGEST_HMAC_SECRET }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/publish_market_source_snapshot.py

      - name: Dispatch ready event through Preview Queue
        env:
          MARKET_EVENT_DISPATCHER_MANUAL_RUN_TOKEN: ${{ secrets.MARKET_EVENT_DISPATCHER_MANUAL_RUN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MARKET_EVENT_DISPATCHER_MANUAL_RUN_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST "$MARKET_EVENT_DISPATCHER_ENDPOINT" \
            --header "Authorization: Bearer $MARKET_EVENT_DISPATCHER_MANUAL_RUN_TOKEN" \
            --header "Content-Type: application/json"

      - name: Assert D1 manifest, outbox, consumer, and briefing states
        run: |
          set -euo pipefail
          query="
          WITH latest_manifest AS (
            SELECT as_of_date, source_version, status, etf_row_count, general_etf_count, ready_at
            FROM market_source_snapshot_manifest
            WHERE status = 'ready'
            ORDER BY ready_at DESC
            LIMIT 1
          )
          SELECT
            m.as_of_date,
            m.source_version,
            m.status AS manifest_status,
            m.etf_row_count,
            m.general_etf_count,
            m.ready_at,
            (
              SELECT delivery_status
              FROM market_source_event_outbox o
              WHERE o.target_name = 'market_briefing'
                AND o.as_of_date = m.as_of_date
                AND o.source_version = m.source_version
              LIMIT 1
            ) AS outbox_status,
            (
              SELECT attempt_count
              FROM market_source_event_outbox o
              WHERE o.target_name = 'market_briefing'
                AND o.as_of_date = m.as_of_date
                AND o.source_version = m.source_version
              LIMIT 1
            ) AS outbox_attempt_count,
            (
              SELECT status
              FROM market_source_consumer_runs c
              WHERE c.consumer_name = 'market_briefing'
                AND c.as_of_date = m.as_of_date
                AND c.source_version = m.source_version
              ORDER BY c.updated_at DESC
              LIMIT 1
            ) AS consumer_status,
            (
              SELECT status
              FROM market_briefings b
              WHERE b.as_of_date = m.as_of_date
              ORDER BY b.published_at DESC
              LIMIT 1
            ) AS briefing_status,
            (
              SELECT published_at
              FROM market_briefings b
              WHERE b.as_of_date = m.as_of_date
              ORDER BY b.published_at DESC
              LIMIT 1
            ) AS published_at
          FROM latest_manifest m;"

          for attempt in $(seq 1 18); do
            npx --yes wrangler@${{ env.WRANGLER_VERSION }} d1 execute ETF_PRICES --remote --env preview --json --command "$query" > /tmp/market-briefing-preview-state.json
            if ATTEMPT="$attempt" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/market-briefing-preview-state.json').read_text())
          rows = payload[0].get('results', []) if isinstance(payload, list) else payload.get('results', [])
          if len(rows) != 1:
              raise SystemExit(f'expected one latest manifest row, got {len(rows)}')

          row = rows[0]
          required = {
              'manifest_status': 'ready',
              'outbox_status': 'sent',
              'consumer_status': 'ready',
              'briefing_status': 'ready',
          }
          missing = {key: {'expected': expected, 'actual': row.get(key)} for key, expected in required.items() if row.get(key) != expected}
          if not row.get('published_at'):
              missing['published_at'] = {'expected': 'non-empty', 'actual': row.get('published_at')}
          if missing:
              print(json.dumps({'attempt': os.environ['ATTEMPT'], 'state': row, 'mismatch': missing}, ensure_ascii=False))
              raise SystemExit(1)
          print(json.dumps({'verified': row}, ensure_ascii=False))
          PY
            then
              exit 0
            fi
            if [ "$attempt" -lt 18 ]; then
              sleep 5
            fi
          done

          echo "Preview event hub did not reach the required ready state within 90 seconds." >&2
          cat /tmp/market-briefing-preview-state.json >&2
          exit 1
