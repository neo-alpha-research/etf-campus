project_id = "etf-campus-community-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326
admin_email = "local-auth@etf-campus.test"
sender_name = "ETF Campus Local"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = "1m"

[auth.rate_limit]
email_sent = 3
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email.smtp]
host = "inbucket"
port = 2500
user = "local"
pass = "local"
admin_email = "local-auth@etf-campus.test"
sender_name = "ETF Campus Local"

[auth.sms]
enable_signup = false
enable_confirmations = false

[realtime]
enabled = false

[storage]
enabled = false
