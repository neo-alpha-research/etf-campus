<script type="text/javascript">
$(document).ready(function(){
	init();
});

function init(){
	$("#searchForm > #method").val("findEtfIsu");
	$("#searchForm > #forward").val("list");
	fnSearchInit();
}

function fnSearchInit(){
	$("#searchForm > #pageIndex").val("1");
	fnSearch();
}

/**
 * 임시 회사명 필드(사용자입력용)의 값을 URI인코딩하여 전송용 회사명 필드에 바인딩
 */
function reflectCorpName(){
    
    var nm = $('input#etfIsuNm').val();        
    // 기존에는 encodeURI를 사용하였으나 +검색 시 서비스단에서 디코딩 할때 공백으로 처리하는 문제로 인해 encodeURIComponent로 인코딩 방법을 변경함. 2024.08.05 bslee
    nm = encodeURIComponent(nm);
    $('#etfIsuNm').val(nm);
}

function fnSearch(){
	setCodeName();
    reflectCorpName();
	$('input#beginIndex').val("");
	$('#searchForm').ajaxSubmit({
		  ajaxUrl : '/common/etfisu.do'
		, ajaxCallBack: fnSearchCallBack
	});
}

function fnSearchCallBack(data){
	$("#contents").empty().append(data);
}

function setEtfInfo(isuSrtCd, isuKorAbbrv, isuCd){
    var	str = "";
        str += "isuSrtCd : " + isuSrtCd + "\n";
        str += "isuKorAbbrv : " + isuKorAbbrv + "\n";
        str += "isuCd : " + isuCd + "\n";
	
	opener.setEtfInfo(isuSrtCd, isuKorAbbrv, isuCd);
    this.close();
}

function setCodeName(){
	$('#etfIsuCd').val("");
	$('#etfIsuNm').val("");
			
	var etfIsu = $('#etfIsu').val();
	etfIsu = etfIsu.toUpperCase();
		
	if(etfIsu == null) return;
	if(etfIsu == "")   return;
	
	if(etfIsu.length == 7){
		
		var fi = etfIsu.charAt(0);
		var fn = etfIsu.substr(1);
		if (fi == 'J' && isNumber(fn)){
			$('#etfIsuCd').val(etfIsu);
			$('#etfIsuNm').val("");
			return;
		}
		
	}	
	$('#etfIsuCd').val("");
	$('#etfIsuNm').val(etfIsu);
	
}

</script>
