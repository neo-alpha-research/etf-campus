          <text x="85" y="73" fill="#64748B" font-size="15" font-weight="600">글로벌 수출 서프라이즈 및 실적 랠리 독주 🚀</text>
          <text x="830" y="58" fill="#D92D20" font-size="32" font-weight="900" text-anchor="end" class="tabular">+6.62%</text>
