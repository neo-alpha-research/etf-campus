        <text x="35" y="36" fill="#B42318" font-size="19" font-weight="900">🔥 오늘 시장을 이끈 TOP 3 주도 테마 (상승 랠리)</text>

        <!-- Rank 1: K-푸드 &amp; K-뷰티 -->
        <g transform="translate(35, 80)">
