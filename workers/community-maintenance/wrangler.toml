name = "etf-campus-community-maintenance"
main = "src/index.ts"
compatibility_date = "2026-08-22"

[triggers]
crons = ["13 15,16,17 * * *", "5 3 * * *"] # 00:13, 01:13, 02:13 KST and 12:05 KST

[vars]
# SUPABASE_URL is configured per environment. SUPABASE_SERVICE_ROLE_KEY and
# MANUAL_RUN_TOKEN must be deployed as secrets and must never be committed.

[observability]
enabled = true

[env.preview]
name = "etf-campus-community-maintenance-preview"

[env.production]
name = "etf-campus-community-maintenance-production"
