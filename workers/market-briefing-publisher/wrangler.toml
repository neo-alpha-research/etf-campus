name = "market-briefing-publisher"
main = "src/index.ts"
compatibility_date = "2026-08-18"

[triggers]
# Event Queue is the normal trigger. KST Tue-Sat 10:37 runs only a D1 reconciliation safety check.
crons = ["37 1 * * 2-6"]

[[d1_databases]]
binding = "ETF_PRICES"
database_name = "etf-prices"
database_id = "11c4e874-fba2-4e34-91d0-808892284c86"

[[kv_namespaces]]
binding = "BRIEFING_KV"
id = "278805f22a4948b3b9b6c66e8a6a1466"

[[queues.consumers]]
queue = "etf-campus-market-data-ready"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "etf-campus-market-data-ready-dlq"

[vars]
FLAT_THRESHOLD_PCT = "0.01"

[env.preview]
name = "market-briefing-publisher-preview"

[[env.preview.d1_databases]]
binding = "ETF_PRICES"
database_name = "etf-prices-preview"
database_id = "ca4eec2e-1828-49f7-a881-3e20374fcf80"

[[env.preview.kv_namespaces]]
binding = "BRIEFING_KV"
id = "1d05ee372504435dbb797169ff4202ce"

[[env.preview.queues.consumers]]
queue = "etf-campus-market-data-ready-preview"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "etf-campus-market-data-ready-preview-dlq"

[env.preview.vars]
FLAT_THRESHOLD_PCT = "0.01"

# The publisher intentionally has no public-data API secret or endpoint binding.
# Optional manual trigger secret:
#   npx wrangler secret put MANUAL_RUN_TOKEN
