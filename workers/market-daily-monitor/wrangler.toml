name = "market-daily-monitor"
main = "src/index.ts"
compatibility_date = "2026-08-25"

[triggers]
# [Monitor] UTC Tue-Sat 01:03 = KST Tue-Sat 10:03.
# [Probe] KST Tue-Sat 05:00~13:45 = UTC Mon-Fri 20:00~23:45, Tue-Sat 00:00~04:45
crons = [
  "3 1 * * 2-6",
  "*/15 * * * *"
]

[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallbacks = []

[[kv_namespaces]]
binding = "PROBE_KV"
id = "a3fc77b8357a46b8afb6d451873ed535"

[vars]
# The target repository to create issues in
GITHUB_REPO = "neo-alpha-research/etf-campus"
BRIEFING_ENDPOINT = "https://etf-campus.pages.dev/api/briefings/latest"
