name = "market-event-dispatcher"
main = "src/index.ts"
compatibility_date = "2026-08-18"
workers_dev = true

[triggers]
# KST Tue-Sat 06:27, 07:27, 08:27. (UTC Mon-Fri 21:27, 22:27, 23:27)
crons = ["27 21,22,23 * * 1-5"]

[[d1_databases]]
binding = "ETF_PRICES"
database_name = "etf-prices"
database_id = "11c4e874-fba2-4e34-91d0-808892284c86"

[[queues.producers]]
binding = "MARKET_BRIEFING_EVENTS"
queue = "etf-campus-market-data-ready"

[vars]
APP_TIMEZONE = "Asia/Seoul"

[env.preview]
name = "market-event-dispatcher-preview"

[[env.preview.d1_databases]]
binding = "ETF_PRICES"
database_name = "etf-prices-preview"
database_id = "ca4eec2e-1828-49f7-a881-3e20374fcf80"

[[env.preview.queues.producers]]
binding = "MARKET_BRIEFING_EVENTS"
queue = "etf-campus-market-data-ready-preview"

[env.preview.vars]
APP_TIMEZONE = "Asia/Seoul"

[env.preview.observability]
enabled = false
head_sampling_rate = 1

[env.preview.observability.logs]
enabled = true
persist = true
invocation_logs = true
head_sampling_rate = 1

[env.preview.observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
